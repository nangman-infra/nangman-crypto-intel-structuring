sonar.projectKey=nangman-crypto-intel-structuring
sonar.projectName=nangman-crypto-intel-structuring
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,ecs,.github/workflows
sonar.tests=src,tests
sonar.test.inclusions=src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs,tests/**/*.rs
sonar.exclusions=target/**,sonar-reports/**,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs,tests/**/*.rs
sonar.coverage.exclusions=scripts/**,ecs/**,.github/**,src/main.rs,src/bin/**,src/storage/object_store.rs,src/storage/object_store/**,src/nats/**,src/ai/bedrock.rs,src/ai/bedrock/**,src/market/parquet_compact/**,src/market/reader/read.rs,src/workflow/processor/**,src/workflow/rehydration/process.rs,src/workflow/rehydration/publish.rs,src/workflow/rehydration/revision_index.rs,src/workflow/rehydration/scan.rs,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs,tests/**/*.rs

sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=sonar-reports/clippy.json
sonar.rust.lcov.reportPaths=sonar-reports/lcov.info
